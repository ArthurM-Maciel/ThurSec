[project]
name = "thursec"
dynamic = ["version"]
description = "ThurSec — modular security assessment toolkit for authorized engagements."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arthur Maciel" }]
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.60", "rich>=13.0"]
# dev pulls in the tui extra so the full test suite (which imports the TUI)
# collects and runs with a single `pip install -e ".[dev]"`.
dev = ["thursec[tui]", "pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
thursec = "thursec.cli:main"
thursec-tui = "thursec.tui.app:main"

# Versão vem de thursec/__init__.py — uma fonte só, sem risco de divergir.
[tool.hatch.version]
path = "thursec/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thursec"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
